<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Anchor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-text: #2c3e50; /* Deep blue/gray */
            --card-bg: #ffffff; /* White card background */
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background 0.5s ease-in-out;
        }
        
        /* Neumorphic Shadow for a simple card */
        .affirmation-card {
            background: var(--card-bg);
            border-radius: 1.5rem;
            box-shadow: 10px 10px 20px #d0d0d0, -10px -10px 20px #ffffff;
            transition: all 0.3s ease;
        }

        /* Gradient for the main display */
        .affirmation-gradient {
            /* Initial placeholder gradient defined by JS */
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: black; /* Fallback */
            transition: background 0.7s ease-in-out;
        }

        /* Helper class for changing the background color of the category indicator */
        .category-gradient-bg {
            transition: background 0.7s ease-in-out;
        }

        .refresh-button {
            border-radius: 9999px;
            box-shadow: 5px 5px 10px #d0d0d0, -5px -5px 10px #ffffff;
            transition: all 0.2s ease-in-out;
            color: var(--primary-text);
        }
        
        .refresh-button:hover {
            box-shadow: 2px 2px 5px #d0d0d0, -2px -2px 5px #ffffff;
            transform: scale(0.98);
        }

        .refresh-button:active {
            box-shadow: inset 2px 2px 5px #d0d0d0, inset -2px -2px 5px #ffffff;
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-gray-50 to-gray-100">

    <!-- Main Affirmation Container -->
    <div id="affirmation-card" class="affirmation-card p-8 md:p-12 w-full max-w-xl text-center">
        
        <!-- Header -->
        <div class="flex items-center justify-center space-x-3 mb-2">
            <!-- Anchor Icon SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-800">
                <path d="M12 22V8"/>
                <path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
                <path d="M12 22v-4"/>
                <circle cx="12" cy="5" r="3"/>
            </svg>
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800">
                The Anchor
            </h1>
        </div>
        
        <!-- Category/Theme Indicator -->
        <p id="category-indicator" 
           class="text-xs md:text-sm font-semibold text-white px-3 py-1 rounded-full inline-block mb-8 category-gradient-bg">
            Loading Theme...
        </p>

        <!-- Affirmation Text Display -->
        <p id="affirmation-text" 
           class="affirmation-gradient text-2xl md:text-4xl font-black leading-snug transition-opacity duration-300 min-h-[100px] flex items-center justify-center">
            Loading initial anchor...
        </p>
        
        <!-- Controls -->
        <div class="mt-12 flex flex-col items-center">
            
            <button id="refresh-button" 
                    class="refresh-button px-8 py-3 bg-gray-100 font-bold text-sm tracking-widest uppercase flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.76 2.87M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.76-2.87"/>
                    <path d="M3 4V1h3m18 3v3"/>
                </svg>
                <span>New Anchor</span>
            </button>
            
            <p id="system-status" class="text-xs mt-4 text-gray-400">System Ready.</p>
        </div>

    </div>

    <script>
        // Data structure mapping categories to gradients and verses (from affirmations.md)
        const categories = {
            // 1. OBSIDIAN (Guidance and Inner Strength)
            'Obsidian (Guidance)': {
                gradient: 'linear-gradient(135deg, #434343, #000000)', // Dark Gray to Black
                verses: [
                    "Rejoice always, pray continually, give thanks in all circumstances; for this is God’s will for you in Christ Jesus. - 1 Thessalonians 5:16-18",
                    "Be joyful in hope, patient in affliction, faithful in prayer. - Romans 12:12",
                    "The joy of the Lord is your strength. - Nehemiah 8:10",
                    "Whatever is true, noble, right, pure, lovely, admirable—if anything is excellent or praiseworthy—think about such things. - Philippians 4:8",
                    "Commit your way to the Lord; trust in him and he will do this. - Psalm 37:5",
                    "Trust in the Lord with all your heart and lean not on your own understanding; in all your ways submit to him, and he will make your paths straight. - Proverbs 3:5-6",
                    "For God did not give us a spirit of timidity, but of power, love and self-control. - 2 Timothy 1:7"
                ]
            },
            // 2. WATER (Peace and Trust)
            'Water (Peace)': {
                gradient: 'linear-gradient(135deg, #00c9ff, #48b1bf)', // Light Blue to Teal
                verses: [
                    "He leads me beside still waters, he refreshes my soul. - Psalm 23:2-3",
                    "So do not fear, for I am with you; do not be dismayed, for I am your God. I will strengthen you and help you. - Isaiah 41:10",
                    "Taste and see that the Lord is good; blessed is the one who takes refuge in him. - Psalm 34:8",
                    "Whoever believes in me, as the Scripture has said, streams of living water will flow from within him. - John 7:38",
                    "You will keep in perfect peace those whose minds are steadfast, because they trust in you. - Isaiah 26:3",
                    "When you pass through the waters, I will be with you; and when you pass through the rivers, they will not sweep over you. - Isaiah 43:2",
                    "Peace I leave with you; my peace I give you. I do not give to you as the world gives. Do not let your hearts be troubled and do not be afraid. - John 14:27"
                ]
            },
            // 3. FOREST (Faith and Perseverance)
            'Forest (Perseverance)': {
                gradient: 'linear-gradient(135deg, #a8ff78, #16a085)', // Bright Green to Dark Green
                verses: [
                    "Blessed is the one who trusts in the Lord, whose confidence is in him. They will be like a tree planted by the water. - Jeremiah 17:7-8",
                    "They are like a tree planted by streams of water, which yields its fruit in season and whose leaf does not wither. - Psalm 1:3",
                    "The righteous flourish like the palm tree and grow like a cedar in Lebanon. - Psalm 92:12",
                    "Faith is confidence in what we hope for and assurance about what we do not see. - Hebrews 11:1",
                    "I can do all this through him who gives me strength. - Philippians 4:13",
                    "But those who hope in the Lord will renew their strength. They will soar on wings like eagles; they will run and not grow weary, they will walk and not be faint. - Isaiah 40:31",
                    "Be very careful, then, how you live—not as unwise but as wise, making the most of every opportunity, because the days are evil. - Ephesians 5:15-16"
                ]
            },
            // 4. STONE (Rock and Refuge)
            'Stone (Refuge)': {
                gradient: 'linear-gradient(135deg, #a9a9a9, #5d4a46)', // Light Gray to Stone Brown
                verses: [
                    "The Lord is my rock, my fortress and my deliverer; my God is my rock, in whom I take refuge. - Psalm 18:2",
                    "Therefore everyone who hears these words of mine and puts them into practice is like a wise man who built his house on the rock. - Matthew 7:24-25",
                    "Do not conform to the pattern of this world, but be transformed by the renewing of your mind. - Romans 12:2",
                    "We demolish arguments and every pretension that sets itself up against the knowledge of God. - 2 Corinthians 10:5",
                    "He alone is my rock and my salvation; he is my fortress, I will not be shaken. - Psalm 62:6",
                    "The eternal God is your refuge, and underneath are the everlasting arms. - Deuteronomy 33:27",
                    "If God is for us, who can be against us? - Romans 8:31"
                ]
            },
            // 5. EMBER (Courage and Hope)
            'Ember (Courage)': {
                gradient: 'linear-gradient(135deg, #ff9966, #ff5e62)', // Orange to Red
                verses: [
                    "Be strong and courageous. Do not be afraid; do not be discouraged, for the Lord your God will be with you wherever you go. - Joshua 1:9",
                    "for our 'God is a consuming fire.' - Hebrews 12:29",
                    "The Lord himself goes before you and will be with you; he will never leave you nor forsake you. - Deuteronomy 31:8",
                    "This hope is a strong and trustworthy anchor for the soul. - Hebrews 6:19",
                    "He must become greater; I must become less. - John 3:30",
                    "May the God of hope fill you with all joy and peace as you trust in him, so that you may overflow with hope by the power of the Holy Spirit. - Romans 15:13",
                    "The fear of man will prove to be a snare, but whoever trusts in the Lord is kept safe. - Proverbs 29:25"
                ]
            },
            // 6. SAND (Endurance and Faith)
            'Sand (Endurance)': {
                gradient: 'linear-gradient(135deg, #F9D423, #FFC72C)', // Yellow to Gold
                verses: [
                    "Let us not become weary in doing good, for at the proper time we will reap a harvest if we do not give up. - Galatians 6:9",
                    "So we fix our eyes not on what is seen, but on what is unseen, since what is seen is temporary, but what is unseen is eternal. - 2 Corinthians 4:18",
                    "Let us run with perseverance the race marked out for us, fixing our eyes on Jesus. - Hebrews 12:1-2",
                    "For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life. - John 3:16",
                    "For we live by faith, not by sight. - 2 Corinthians 5:7",
                    "For it is by grace you have been saved, through faith—and this is not from yourselves, it is the gift of God. - Ephesians 2:8",
                    "But the one who stands firm to the end will be saved. - Matthew 24:13"
                ]
            },
            // 7. SKY (Glory and New Mercies)
            'Sky (Glory)': {
                gradient: 'linear-gradient(135deg, #c3e0ff, #7f8cfc)', // Pale Blue to Lavender
                verses: [
                    "The heavens declare the glory of God; the skies proclaim the work of his hands. - Psalm 19:1",
                    "I lift up my eyes to the mountains—where does my help come from? My help comes from the Lord, the Maker of heaven and earth. - Psalm 121:1-2",
                    "Everything is possible for one who believes. - Mark 9:23",
                    "“For I know the plans I have for you,” declares the Lord, “plans to prosper you and not to harm you, plans to give you hope and a future.” - Jeremiah 29:11",
                    "When these things begin to take place, stand up and lift up your heads, because your redemption is drawing near. - Luke 21:28",
                    "Call to me and I will answer you and tell you great and unsearchable things you do not know. - Jeremiah 33:3",
                    "The steadfast love of the Lord never ceases; his mercies never come to an end; they are new every morning; great is your faithfulness. - Lamentations 3:22-23 (ESV)"
                ]
            }
        };

        const categoryKeys = Object.keys(categories);
        const affirmationTextElement = document.getElementById('affirmation-text');
        const categoryIndicatorElement = document.getElementById('category-indicator');
        const refreshButton = document.getElementById('refresh-button');
        const systemStatus = document.getElementById('system-status');
        
        let lastCategoryKey = null;

        /**
         * Gets a random category key, ensuring it's not the same as the last one displayed.
         * @param {Array} keys - The array of category keys.
         * @param {string} lastKey - The key of the last displayed category.
         * @returns {string} The new random category key.
         */
        function getRandomCategoryKey(keys, lastKey) {
            let newKey;
            if (keys.length <= 1) return keys[0];
            do {
                newKey = keys[Math.floor(Math.random() * keys.length)];
            } while (newKey === lastKey);
            return newKey;
        }

        /**
         * Displays a new random affirmation with a smooth transition.
         */
        function displayRandomAffirmation() {
            refreshButton.disabled = true;
            systemStatus.textContent = 'PROTOCOL INITIATED...';
            
            const categoryKey = getRandomCategoryKey(categoryKeys, lastCategoryKey);
            lastCategoryKey = categoryKey;
            
            const category = categories[categoryKey];
            const verseIndex = Math.floor(Math.random() * category.verses.length);
            const affirmationText = category.verses[verseIndex];
            const affirmationGradient = category.gradient;

            // 1. Fade out the text and indicator
            affirmationTextElement.style.opacity = '0';
            categoryIndicatorElement.style.opacity = '0';
            
            // 2. Change content and gradient after a short delay (for the fade out)
            setTimeout(() => {
                // Update text
                affirmationTextElement.textContent = affirmationText;
                
                // Update gradients
                affirmationTextElement.style.backgroundImage = affirmationGradient;
                categoryIndicatorElement.style.backgroundImage = affirmationGradient;
                categoryIndicatorElement.textContent = categoryKey.toUpperCase();
                
                // 3. Fade in the new content
                affirmationTextElement.style.opacity = '1';
                categoryIndicatorElement.style.opacity = '1';

                // 4. Update status and enable button
                systemStatus.textContent = 'ANCHOR ESTABLISHED.';
                refreshButton.disabled = false;
            }, 300); // Matches CSS transition time
        }

        // Event listener for the refresh button
        refreshButton.addEventListener('click', displayRandomAffirmation);

        // Initial load
        window.onload = () => {
            displayRandomAffirmation();
        };

    </script>
</body>
</html>
